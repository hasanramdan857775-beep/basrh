<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGradMask" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2D1808" />
      <stop offset="60%" stop-color="#150B04" />
      <stop offset="100%" stop-color="#080301" />
    </radialGradient>
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="cardGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>

  <!-- Full bleed background for maskable canvas -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Safe Zone Group (Scaled down to 80% to fit within Android 40% safe radius) -->
  <g transform="translate(51, 51) scale(0.8)">
    <!-- Gold decorative border -->
    <rect x="12" y="12" width="488" height="488" rx="95" fill="none" stroke="url(#goldGradMask)" stroke-width="8" opacity="0.85" />

    <!-- Card suits in corners -->
    <g opacity="0.15" fill="#F59E0B">
      <text x="60" y="110" font-size="54">♠</text>
      <text x="410" y="110" font-size="54">♥</text>
      <text x="60" y="440" font-size="54">♦</text>
      <text x="410" y="440" font-size="54">♣</text>
    </g>

    <!-- Left Card (7 Diamond) -->
    <g transform="translate(195, 235) rotate(-18) translate(-75, -110)">
      <rect width="150" height="220" rx="14" fill="url(#cardGradMask)" stroke="#CBD5E1" stroke-width="3"/>
      <text x="18" y="42" font-family="'Cairo', sans-serif" font-weight="900" font-size="34" fill="#DC2626">7</text>
      <text x="20" y="72" font-size="28" fill="#DC2626">♦</text>
      <text x="75" y="130" font-size="56" text-anchor="middle" fill="#DC2626">♦</text>
    </g>

    <!-- Right Card (Jack) -->
    <g transform="translate(315, 235) rotate(18) translate(-75, -110)">
      <rect width="150" height="220" rx="14" fill="url(#cardGradMask)" stroke="#CBD5E1" stroke-width="3"/>
      <text x="18" y="42" font-family="'Cairo', sans-serif" font-weight="900" font-size="34" fill="#2563EB">J</text>
      <text x="20" y="72" font-size="28" fill="#2563EB">♠</text>
      <text x="75" y="130" font-size="56" text-anchor="middle" fill="#2563EB">♠</text>
    </g>

    <!-- Center Card (Ace) -->
    <g transform="translate(256, 220) translate(-80, -115)">
      <rect width="160" height="230" rx="16" fill="url(#cardGradMask)" stroke="url(#goldGradMask)" stroke-width="5"/>
      <text x="20" y="44" font-family="'Cairo', sans-serif" font-weight="900" font-size="36" fill="#DC2626">A</text>
      <text x="22" y="75" font-size="30" fill="#DC2626">♥</text>
      <text x="80" y="145" font-size="70" text-anchor="middle" fill="#DC2626">♥</text>
    </g>

    <!-- Egyptian Golden Ribbon / Banner -->
    <g transform="translate(256, 400)">
      <rect x="-190" y="-32" width="380" height="64" rx="20" fill="url(#goldGradMask)" stroke="#FEF08A" stroke-width="3"/>
      <text x="0" y="11" font-family="'Cairo', sans-serif" font-weight="900" font-size="34" fill="#3B1204" text-anchor="middle">
        باصرة مصرية
      </text>
    </g>
  </g>
</svg>
